# Name of the workflow - shown in the Actions tab on GitHub
name: Python CI

# WHEN should the workflow run? (the trigger)
# Run on every push to main, and on pull requests aimed at main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# WHAT should the workflow do? (the jobs)
jobs:
  test:                          # name of our only job
    runs-on: ubuntu-latest       # a fresh Linux machine provided by GitHub
    steps:
      # Step 1: Download (check out) the repository code onto the machine
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Install Python on the machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install the packages listed in requirements.txt (pytest)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run all test cases. If any test fails, this step fails
      # and GitHub shows a red cross.
      - name: Run tests
        run: pytest